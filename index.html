</style></head><body><aside><div class="logo">Law<b>Lab</b> <span class="small">7162</span></div><p class="small">AQA A-level Law • interactive revision</p><button class="nav active" onclick="home()">⌂ Dashboard</button><button class="nav" onclick="showSources()">▤ Sources & exam guidance</button><hr><input id="search" placeholder="Search 60+ lessons..." oninput="renderNav()" style="width:100%"><div id="filters" style="margin:12px 0"></div><div id="topicList"></div></aside><main id="app"></main><script>
const topics=[{"group": "Criminal", "title": "Actus reus and omissions", "rule": "Actus reus is the external element of an offence: conduct, prohibited result or circumstances. Usually there is no liability for failing to act unless a legal duty exists, for example a duty from statute, contract, relationship, voluntary assumption of care, or creation of danger.", "cases": "R v Miller — creating a dangerous situation may give rise to a duty to act; R v Stone and Dobinson — assuming care can establish a duty; R v Pittwood — contractual duty.", "statute": "", "example": "A person accidentally starts a small fire, notices it, then leaves. Explain why the omission after noticing the danger matters.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Causation", "rule": "For result crimes the prosecution proves factual causation (but for the defendant’s conduct would the result have occurred?) and legal causation (a significant operating cause). An independent intervening act may break the chain.", "cases": "R v White — but-for test; R v Smith — operating and substantial cause; R v Cheshire — medical treatment rarely breaks chain; R v Blaue — take victim as found.", "statute": "", "example": "A victim refuses medical treatment after an injury. Consider the thin-skull rule and whether causation remains.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Mens rea: intention and recklessness", "rule": "Direct intention means a result is the defendant’s aim. Oblique intention may be found when death or serious injury is a virtual certainty and the defendant appreciates that fact; the jury is entitled, not required, to infer intention. Subjective recklessness requires awareness of a risk and unreasonable taking of it.", "cases": "R v Woollin — virtual certainty; R v Cunningham — subjective recklessness; R v G and another — awareness of risk.", "statute": "", "example": "A person knows a harmful result is virtually certain but says it was not their purpose. Explain oblique intention.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Negligence, transferred malice and coincidence", "rule": "Negligence assesses departure from required care. Transferred malice may transfer intent between victims of the same type of offence. Actus reus and mens rea must coincide, although a continuing act or series of acts can satisfy the rule.", "cases": "R v Latimer — transferred malice; R v Pembliton — limits; Fagan v MPC — continuing act; Thabo Meli v R — single transaction.", "statute": "", "example": "A driver accidentally drives onto an officer’s foot and then deliberately refuses to move. Apply the continuing-act principle.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Strict liability and criminal law theory", "rule": "Some offences dispense with proof of mens rea for at least one element. Courts generally presume mens rea unless legislation clearly displaces it. Evaluate public protection, efficiency, fairness and fault. Criminalisation should consider harm, autonomy, fair labelling and certainty.", "cases": "Sweet v Parsley — presumption of mens rea; Gammon (Hong Kong) Ltd v AG — guidance on strict liability.", "statute": "", "example": "Discuss whether strict liability is fair where a defendant took every reasonable precaution.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Murder", "rule": "Murder is the unlawful killing of a human being under the King’s peace with intention to kill or cause grievous bodily harm. Prove actus reus, causation and mens rea. Intention to cause serious harm is sufficient, even if death was not intended.", "cases": "R v Vickers — intent to cause GBH sufficient; R v Woollin — oblique intention; R v Malcherek and Steel — life support and causation.", "statute": "Common law", "example": "A defendant intends to cause serious injury and the victim dies. Explain why an intention to kill is not essential.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Loss of control", "rule": "A partial defence reducing murder to voluntary manslaughter. There must be loss of self-control, a qualifying trigger (fear of serious violence or things said/done of exceptionally grave character causing justifiable sense of being seriously wronged), and a person of the same age and sex with normal tolerance and self-restraint might have reacted similarly. Revenge excludes the defence. Loss need not be sudden.", "cases": "R v Clinton — sexual infidelity may be contextual evidence; R v Dawes — limitations; R v Jewell — loss of control.", "statute": "Coroners and Justice Act 2009 ss54–55", "example": "An accused acts after prolonged provocation. Examine qualifying triggers, revenge and objective test.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Diminished responsibility", "rule": "Partial defence to murder: abnormality of mental functioning from a recognised medical condition, substantially impairing understanding conduct, rational judgment or self-control, providing an explanation for the killing. Defence proves on balance of probabilities.", "cases": "R v Golds — substantial impairment; R v Dietschmann — intoxication and underlying abnormality.", "statute": "Homicide Act 1957 s2 (as amended by Coroners and Justice Act 2009)", "example": "Distinguish the recognised condition from ordinary voluntary intoxication.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Unlawful act manslaughter", "rule": "Requires an intentional unlawful criminal act, objectively dangerous because a sober reasonable person would recognise a risk of some physical harm, which causes death. Defendant needs mens rea for the base offence, not foresight of death.", "cases": "R v Church — objective dangerousness; R v Newbury and Jones — no need to foresee harm; R v Lamb — base criminal act required.", "statute": "", "example": "A person commits a minor battery and unexpectedly causes death. Work through each element.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Gross negligence manslaughter", "rule": "Duty of care, breach, causation, serious and obvious risk of death at time of breach, and negligence so gross it should be criminal. Whether conduct is gross is a jury question.", "cases": "R v Adomako — gross negligence framework; R v Rose — serious and obvious risk assessed at time of breach.", "statute": "", "example": "A professional fails to act and a patient dies. Distinguish civil negligence from criminal grossness.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Assault and battery", "rule": "Assault: intentionally or recklessly causing another to apprehend immediate unlawful personal violence. Battery: intentional or reckless application of unlawful force, which can be slight. Words and silence may count in context.", "cases": "R v Ireland — silent calls can constitute assault; Collins v Wilcock — everyday contact; Fagan v MPC — battery as continuing act.", "statute": "Criminal Justice Act 1988 s39 (mode of trial and penalty)", "example": "A person makes threatening calls without touching anyone. Distinguish assault from battery.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Section 47 ABH", "rule": "Assault or battery occasioning actual bodily harm: injury more than transient or trifling, including recognised psychiatric injury. Mens rea needed for underlying assault or battery, not the resulting ABH.", "cases": "R v Miller — ABH definition; R v Chan-Fook — psychiatric injury; R v Savage; Parmenter — mens rea.", "statute": "Offences Against the Person Act 1861 s47", "example": "An intentional push causes a fractured tooth. Explain why intent to cause the injury is unnecessary.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Section 20 GBH and wounding", "rule": "Unlawfully and maliciously wound or inflict grievous bodily harm. Wound requires a break in continuity of the whole skin; GBH is really serious harm. Mens rea is intention or recklessness as to some physical harm, not necessarily serious harm.", "cases": "R v Mowatt — foresight of some harm; R v Burstow — psychiatric injury can be GBH; DPP v Smith — really serious harm.", "statute": "Offences Against the Person Act 1861 s20", "example": "A defendant foresees minor injury but causes serious injury. Contrast s20 with s18.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Section 18 GBH with intent", "rule": "Wounding or causing GBH with specific intent to cause grievous bodily harm (or relevant intent to resist lawful apprehension under the statutory wording). Unlike s20, recklessness as to some harm is insufficient for the usual GBH-intent route.", "cases": "R v Belfon — specific intent; R v Morrison — resisting arrest route.", "statute": "Offences Against the Person Act 1861 s18", "example": "Explain how evidence of deliberate targeting and planning may support intent to cause GBH.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Theft", "rule": "Dishonestly appropriating property belonging to another with intention permanently to deprive. Analyse each element separately: appropriation, property, belonging to another, dishonesty and intention permanently to deprive.", "cases": "R v Morris — appropriation; R v Gomez — consent does not prevent appropriation; R v Hinks — gifts; Ivey v Genting Casinos — dishonesty test; R v Velumyl — permanent deprivation.", "statute": "Theft Act 1968 ss1–6", "example": "Someone takes money intending to return different banknotes later. Apply s6 and Velumyl.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Robbery", "rule": "Theft plus use or threat of force on any person immediately before or at the time of stealing and in order to steal. Assess the timing and purpose of force carefully.", "cases": "R v Dawson and James — force is a jury question; R v Hale — appropriation may be continuing; R v Lockley — force during escape.", "statute": "Theft Act 1968 s8", "example": "A shoplifter pushes a guard while leaving with stolen goods. Analyse whether robbery is made out.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Attempt", "rule": "Under s1 a person, with intent to commit an indictable offence, does an act more than merely preparatory to its commission. Mere preparation is insufficient; impossibility does not necessarily prevent liability.", "cases": "R v Gullefer — merely preparatory; R v Jones — more than merely preparatory; R v Geddes — preparation; R v Shivpuri — impossibility.", "statute": "Criminal Attempts Act 1981 s1", "example": "A person waits with equipment but has not confronted the intended victim. Compare Geddes and Jones.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Insanity", "rule": "M’Naghten rules: defect of reason from disease of the mind so the defendant did not know nature and quality of act or did not know it was legally wrong. Legal disease of mind differs from everyday medical usage.", "cases": "M’Naghten’s Case — rules; R v Kemp — arteriosclerosis; R v Sullivan — epilepsy; R v Windle — legally wrong.", "statute": "", "example": "Explain why a physical condition affecting mental functioning can count as disease of mind.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Automatism", "rule": "Total destruction of voluntary control from an external factor can lead to acquittal. Internal causes tend to fall under insanity; self-induced automatism may restrict reliance.", "cases": "Bratty v AG for Northern Ireland — involuntary conduct; R v Quick — insulin external factor; R v Hennessy — internal factor; AG Ref (No 2 of 1992) — total loss of control.", "statute": "", "example": "Distinguish low blood sugar caused by insulin from hyperglycaemia caused by diabetes.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Intoxication", "rule": "Voluntary intoxication may prevent formation of mens rea for specific-intent offences but generally not basic-intent offences; intoxication is not an automatic defence. Involuntary intoxication may negate mens rea but does not excuse formed intent.", "cases": "DPP v Majewski — basic intent; R v Kingston — involuntary intoxication and formed intent; R v Hardie — unexpected effect; R v Lipman — specific intent.", "statute": "", "example": "Compare voluntary intoxication in murder and s20 GBH without assuming automatic acquittal.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Self-defence and prevention of crime", "rule": "Defendant must honestly believe force necessary; force used must be reasonable in circumstances as believed. Mistaken belief may be relevant, but a mistake attributable to voluntary intoxication is generally excluded. Distinguish ordinary and householder rules.", "cases": "R v Gladstone Williams — honest mistake; R v Owino — reasonable force; R v Clegg — excessive force.", "statute": "Criminal Law Act 1967 s3; Criminal Justice and Immigration Act 2008 s76", "example": "A defendant mistakenly thinks an attacker is armed. Consider honest belief and proportionality.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Duress by threats", "rule": "Threat of death or serious injury; defendant reasonably believes threat; sober person of reasonable firmness sharing relevant characteristics might act similarly; no safe avenue of escape; close causal link. Not available for murder or attempted murder.", "cases": "R v Graham — two-stage test; R v Hasan — limits; R v Howe — murder excluded; R v Gotts — attempted murder excluded.", "statute": "", "example": "Assess whether a threat against a family member, and a chance to contact police, affect the defence.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Criminal", "title": "Duress of circumstances", "rule": "Pressure comes from threatening circumstances rather than an individual’s demand. There must be imminent danger of death or serious injury and proportionate response, subject to the ordinary duress restrictions.", "cases": "R v Willer — escaping danger; R v Conway — perceived threat; R v Martin — circumstances.", "statute": "", "example": "A driver breaks a traffic rule to escape an immediate threat. Analyse necessity and reasonable response.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Tort", "title": "Duty of care", "rule": "Apply neighbour principle and, where appropriate, Caparo foreseeability, proximity and whether imposing a duty is fair, just and reasonable.", "cases": "Donoghue v Stevenson; Caparo v Dickman", "statute": "", "example": "Identify the legal issue, state the governing rule, apply each element to the facts and give a reasoned conclusion.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Tort", "title": "Breach of duty", "rule": "Compare defendant with reasonable person; weigh probability and seriousness of harm, cost of precautions and social utility.", "cases": "Blyth v Birmingham Waterworks; Bolton v Stone; Paris v Stepney; Latimer v AEC", "statute": "", "example": "Identify the legal issue, state the governing rule, apply each element to the facts and give a reasoned conclusion.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Tort", "title": "Causation and remoteness in negligence", "rule": "Use but-for causation; assess intervening acts and reasonable foreseeability of kind of damage.", "cases": "Barnett v Chelsea; The Wagon Mound (No 1); Hughes v Lord Advocate", "statute": "", "example": "Identify the legal issue, state the governing rule, apply each element to the facts and give a reasoned conclusion.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Tort", "title": "Pure economic loss", "rule": "Generally not recoverable for negligent acts alone; negligent statements may generate liability where special relationship and reasonable reliance exist.", "cases": "Spartan Steel; Hedley Byrne v Heller; Caparo v Dickman", "statute": "", "example": "Identify the legal issue, state the governing rule, apply each element to the facts and give a reasoned conclusion.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Tort", "title": "Psychiatric injury", "rule": "Distinguish primary and secondary victims; secondary claims face proximity, relationship and sudden shock control mechanisms.", "cases": "Page v Smith; Alcock v Chief Constable of South Yorkshire", "statute": "", "example": "Identify the legal issue, state the governing rule, apply each element to the facts and give a reasoned conclusion.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Tort", "title": "Occupiers liability 1957", "rule": "Occupiers owe lawful visitors a common duty to take reasonable care to keep them reasonably safe for permitted purpose.", "cases": "Wheat v Lacon; Glasgow Corporation v Taylor; Roles v Nathan", "statute": "Occupiers’ Liability Act 1957", "example": "Identify the legal issue, state the governing rule, apply each element to the facts and give a reasoned conclusion.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Tort", "title": "Occupiers liability 1984", "rule": "For non-visitors assess awareness of danger, foreseeable presence, and whether protection is reasonable; duty to take reasonable care may arise.", "cases": "British Railways Board v Herrington; Tomlinson v Congleton", "statute": "Occupiers’ Liability Act 1984", "example": "Identify the legal issue, state the governing rule, apply each element to the facts and give a reasoned conclusion.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Tort", "title": "Private nuisance", "rule": "Unreasonable interference with use/enjoyment of land; consider duration, locality, sensitivity, malice and foreseeability.", "cases": "Sturges v Bridgman; Hunter v Canary Wharf; Christie v Davey", "statute": "", "example": "Identify the legal issue, state the governing rule, apply each element to the facts and give a reasoned conclusion.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Tort", "title": "Rylands v Fletcher", "rule": "Exceptional strict liability for escape of a dangerous thing accumulated for an extraordinary or unusual use of land, causing foreseeable relevant damage.", "cases": "Rylands v Fletcher; Cambridge Water; Transco v Stockport", "statute": "", "example": "Identify the legal issue, state the governing rule, apply each element to the facts and give a reasoned conclusion.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Tort", "title": "Vicarious liability", "rule": "Consider relationship akin to employment and close connection between tort and authorised activities.", "cases": "Various Claimants v Catholic Child Welfare Society; Mohamud v WM Morrison; Barclays Bank v Various Claimants", "statute": "", "example": "Identify the legal issue, state the governing rule, apply each element to the facts and give a reasoned conclusion.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Tort", "title": "Tort defences", "rule": "Contributory negligence may reduce damages; volenti requires genuine informed consent to legal risk.", "cases": "Froom v Butcher; Smith v Baker", "statute": "Law Reform (Contributory Negligence) Act 1945", "example": "Identify the legal issue, state the governing rule, apply each element to the facts and give a reasoned conclusion.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Tort", "title": "Tort remedies", "rule": "Damages compensate proven loss; injunctions restrain conduct, subject to equitable discretion.", "cases": "Shelfer v City of London Electric Lighting", "statute": "", "example": "Identify the legal issue, state the governing rule, apply each element to the facts and give a reasoned conclusion.", "pitfall": "Do not simply name a case: explain its principle and connect it to the facts."}, {"group": "Contract", "title": "Offer and invitation to treat", "rule": "An offer indicates willingness to be bound on acceptance; invitations to treat invite offers. Unilateral offers may be accepted by let active=null,stage=0,answers={},group='All';const groups=['All','Criminal','Tort','Contract','Legal system','Human rights'];const STORE='lawlab7162progress';let done=JSON.parse(localStorage.getItem(STORE)||'{}');const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderNav(){document.getElementById('filters').innerHTML=groups.map(g=>`<button class="tag" style="background:${group===g?'#315b54':'transparent'};cursor:pointer" onclick="group=${JSON.stringify(g)};renderNav()">${g}</button>`).join('');let q=document.getElementById('search').value.toLowerCase();document.getElementById('topicList').innerHTML=topics.map((t,i)=>({...t,i})).filter(t=>(group==='All'||t.group===group)&&(t.title+' '+t.rule).toLowerCase().includes(q)).map(t=>`<button class="nav ${active===t.i?'active':''}" onclick="openTopic(${t.i})">${done[t.i]?'✓ ':'○ '}${escapeHTML(t.title)}</button>`).join('')||'<p class="small">No matches.</p>'}

function draw(){let t=topics[active];let steps=['1 · Learn (10 min)','2 · Recall (5 min)','3 · Exam (10 min)'];let cases=t.cases.split(';').map(x=>x.trim()).filter(Boolean);let qs=makeQuiz(t);document.getElementById('app').innerHTML=`<button class="secondary" onclick="home()">← Dashboard</button><div class="eyebrow" style="margin-top:24px">${t.group} / Lesson ${active+1} of ${topics.length}</div><h1>${escapeHTML(t.title)}</h1><p>25-minute study plan · Guided explanation → knowledge test → written exam practice</p><div class="steps">${steps.map((s,i)=>`<button class="${stage===i?'active':''}" onclick="stage=${i};draw()">${s}</button>`).join('')}</div>${stage===0?`<div class="lesson"><div class="eyebrow">Start with the meaning</div><h2>The rule in plain English</h2><p>${escapeHTML(t.rule)}</p><div class="notice"><b>What an examiner wants:</b> identify the legal issue, define the precise elements, cite the relevant authority and explain why each fact satisfies or fails the test.</div><h3>Statutory foundation</h3><p>${escapeHTML(t.statute||'This lesson is primarily grounded in common-law principles and judicial decisions. Check the linked sources for full context.')}</p><h3>Case-law and authorities to remember</h3>${cases.map((c,i)=>`<details class="card" style="margin:8px 0"><summary><b>Authority ${i+1}:</b> ${escapeHTML(c.split(' — ')[0])}</summary><p>${escapeHTML(c.includes(' — ')?c.split(' — ').slice(1).join(' — '):'Research the facts, legal principle and why the court reached its conclusion.')}</p><p class="small">Memory challenge: explain how this authority changes the answer to a problem question.</p></details>`).join('')}<h3>Worked application prompt</h3><p>${escapeHTML(t.example)}</p><div class="notice"><b>Common mistake:</b> ${escapeHTML(t.pitfall)}</div><h3>Mastery checklist</h3><label><input type="checkbox"> I can explain the rule without looking</label><br><label><input type="checkbox"> I can link at least two authorities to legal principles</label><br><label><input type="checkbox"> I can apply the rule to new facts</label><hr><a href="https://www.e-lawresources.co.uk/Criminal.php" target="_blank">Explore the e-lawresources criminal law library ↗</a></div><button class="primary" onclick="stage=1;draw()">Start recall quiz →</button>`:stage===1?`<div class="lesson"><h2>Active recall test</h2><p>Answer without looking at the lesson. Review explanations after submitting.</p>${qs.map((q,i)=>`<div class="card" style="margin:14px 0"><b>${i+1}. ${q.q}</b>${q.opts.map((o,j)=>`<button class="option ${answers[i]===j?'selected':''}" onclick="answers[${i}]=${j};draw()">${String.fromCharCode(65+j)}. ${escapeHTML(o)}</button>`).join('')}</div>`).join('')}<button class="primary" onclick="gradeQuiz()">Mark quiz</button><div id="quizResult"></div></div>`:`<div class="lesson"><div class="eyebrow">Original AQA-style practice — not an official past-paper question</div><h2>Apply the law: ${escapeHTML(t.title)}</h2><p><b>Scenario:</b> ${escapeHTML(t.example)}</p><p><b>Question (10-mark practice):</b> Advise on the relevant legal issues, using appropriate statutory provisions and/or case authorities, and reach a reasoned conclusion.</p><div class="notice">Suggested 10-minute writing structure: 2 minutes issue and rule; 2 minutes authority; 5 minutes precise application; 1 minute conclusion.</div><textarea id="essay" placeholder="Write your response here. Use the legal rule, named authority and specific application to the scenario."></textarea><div style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0"><button class="primary" onclick="markEssay()">Get practice feedback</button><button class="secondary" onclick="document.getElementById('model').classList.toggle('hide')">Show answer plan</button></div><div id="model" class="card hide"><h3>Indicative answer plan</h3><p><b>Legal rule:</b> ${escapeHTML(t.rule)}</p><p><b>Authorities:</b> ${escapeHTML(t.cases)}</p><p><b>Statute:</b> ${escapeHTML(t.statute||'Use relevant common-law principles.')}</p><p><b>Application:</b> Apply each element to the facts and acknowledge plausible alternatives before concluding.</p></div><div id="essayResult"></div></div><p class="small">Written-answer feedback is an offline heuristic, not AI marking, not an AQA-approved mark and not a substitute for a teacher or examiner.</p>`}<hr><button class="secondary" onclick="openTopic(${Math.min(active+1,topics.length-1)})">Next lesson →</button>`}
function gradeQuiz(){let qs=makeQuiz(topics[active]);let score=qs.filter((q,i)=>answers[i]===q.correct).length;document.getElementById('quizResult').innerHTML=`<div class="result"><h2>${score}/${qs.length} correct</h2>${qs.map((q,i)=>`<p><b>Q${i+1}:</b> ${answers[i]===q.correct?'✓ Correct':'✗ Correct answer: '+String.fromCharCode(65+q.correct)}. ${q.why}</p>`).join('')}<button class="primary" onclick="stage=2;draw()">Continue to exam practice →</button></div>`}
function markEssay(){let t=topics[active],v=document.getElementById('essay').value.trim(),low=v.toLowerCase();if(v.length<50){document.getElementById('essayResult').innerHTML='<div class="result">Write a developed answer (at least 50 characters) before requesting feedback.</div>';return}let authorities=t.cases.split(';').map(s=>s.trim().split(' — ')[0].toLowerCase()).filter(Boolean),hits=authorities.filter(a=>low.includes(a)||a.startsWith('r v ')&&low.includes(a.slice(4))).length;let statute=t.statute&&t.statute.toLowerCase().split(' ')[0],hasLaw=hits>0||(statute&&low.includes(statute)),apply=/because|therefore|however|since|on these facts|in this case|arguably|although/.test(low),conclude=/conclusion|likely|unlikely|therefore|overall/.test(low),depth=v.split(/\s+/).length>=110;let checks=[['Relevant legal authority',!!hasLaw,'Name and accurately explain a case or statutory provision.'],['Application and counterargument',apply,'Explain why a specific fact meets each element and consider the opposing view.'],['Reasoned conclusion',conclude,'Conclude on likely liability or legal outcome, with appropriate qualification.'],['Development',depth,'Develop the explanation and application rather than listing legal words.']];let n=checks.filter(x=>x[1]).length;document.getElementById('essayResult').innerHTML=`<div class="result"><h2>Practice feedback</h2><p><b>Indicative writing checklist: ${n}/4</b> — this is NOT a mark out of 10 or a predicted AQA grade.</p>${checks.map(x=>`<p>${x[1]?'✓':'○'} <b>${x[0]}:</b> ${x[1]?'Some evidence detected. Check legal accuracy manually.':x[2]}</p>`).join('')}<p><b>Next step:</b> compare your response with the answer plan and official AQA mark schemes. Automated keyword checks cannot assess factual accuracy or award defensible AO1/AO2/AO3 marks.</p><button class="primary" onclick="completeLesson()">Mark lesson complete ✓</button></div>`}
